<aside
  id="logo-sidebar"
  class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform -translate-x-full sm:translate-x-0 shadow-md"
  aria-label="Sidebar"
>
  <div class="h-full px-3 py-4 overflow-y-auto bg-white dark:bg-gray-800">
    <a href="http://localhost:4200/" class="flex items-center ps-2.5 mb-5">
      <img
        src="../assets/images/iconGmf.png"
        class="h-14 me-3"
        alt="Flowbite Logo"
      />
    </a>
    <ul class="space-y-2 font-medium">
      <li>
        <a
          href="#"
          class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
          [ngClass]="{ 'bg-gray-100 dark:bg-gray-700': isActive('/home') }"
          routerLink="/home"
        >
          <i-feather name="Home" class="w-5 h-5 text-gray-500 transition duration-150 dark:text-gray-400 group-hover:text-gray-900 dark:group-hover:text-white"></i-feather>
          <span class="ms-3">Home</span>
        </a>
      </li>
      <li>
        <button
          type="button"
          class="flex items-center w-full p-2 text-base text-gray-900 transition duration-75 rounded-lg group hover:bg-gray-100 dark:text-white dark:hover:bg-gray-700"
          aria-controls="dropdown-example"
          data-collapse-toggle="dropdown-example"
        >
          <i-feather name="dollar-sign" class="flex-shrink-0 w-5 h-5 text-gray-500 transition duration-75 group-hover:text-gray-900 dark:text-gray-400 dark:group-hover:text-white"></i-feather>
          <span class="flex-1 ms-3 text-left rtl:text-right whitespace-nowrap"
            >Compensation</span
          >
        <i-feather name="chevron-down" class="text-gray-500"></i-feather>
        </button>
        <ul id="dropdown-example" class="hidden py-2 space-y-2">
          <li>
            <a
              href="#"
              class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
              [ngClass]="{
                'bg-gray-100 dark:bg-gray-700': isActive('/compensation/salary-increment')
              }"
              routerLink="/compensation/salary-increment"
              >Salary Increment</a
            >
          </li>
          <li>
            <a
              href="#"
              class="flex items-center p-2 text-gray-900 rounded-lg dark:text-white hover:bg-gray-100 dark:hover:bg-gray-700 group"
              [ngClass]="{
                'bg-gray-100 dark:bg-gray-700': isActive('/compensation/incentive-allocation')
              }"
              routerLink="/compensation/incentive-allocation"
              >Incentive Allocation</a
            >
          </li>
        </ul>
      </li>
    </ul>
  </div>
</aside>

<div class="px-4 py-4 sm:ml-64 bg-gray-100">
  <div
    class="flex items-center justify-between md:justify-end mb-4 rounded bg-gray-50 dark:bg-gray-800 shadow-md"
  >
    <button
      data-drawer-target="logo-sidebar"
      data-drawer-toggle="logo-sidebar"
      aria-controls="logo-sidebar"
      type="button"
      class="inline-flex items-center p-2 mt-2 ms-3 text-sm text-gray-500 rounded-lg sm:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-600"
    >
      <span class="sr-only">Open sidebar</span>
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        fill="currentColor"
        viewBox="0 0 20 20"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          clip-rule="evenodd"
          fill-rule="evenodd"
          d="M2 4.75A.75.75 0 012.75 4h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 4.75zm0 10.5a.75.75 0 01.75-.75h7.5a.75.75 0 010 1.5h-7.5a.75.75 0 01-.75-.75zM2 10a.75.75 0 01.75-.75h14.5a.75.75 0 010 1.5H2.75A.75.75 0 012 10z"
        ></path>
      </svg>
    </button>
    <div class="flex flex-col w-full ml-2 relative">
      <div>
        <input
          type="text"
          placeholder="Search menu..."
          class="block w-full text-sm text-gray-900 border border-transparent rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          [(ngModel)]="searchTerm"
          (input)="filterMenu()"
        />
        <div
          class="absolute inset-y-0 right-0 flex items-center pr-3 cursor-pointer"
          *ngIf="searchTerm"
          (click)="clearSearch()"
        >
          X
        </div>
      </div>
      <ul
        class="menu-list absolute left-0 right-0 bg-white border rounded-b-lg shadow-md"
        *ngIf="searchTerm"
        style="top: 100%"
      >
        <li *ngFor="let menu of filteredMenuList" class="p-2 hover:bg-gray-200">
          <a [routerLink]="menu.path" class="block w-full h-full">{{ menu.label }}</a>
        </li>
      </ul>
    </div>
    <div class="flex items-center justify-end my-2 mr-5">
      <div class="flex items-center justify-end ms-3">
        <button
          type="button"
          class="flex text-sm bg-gray-800 rounded-full focus:ring-4 focus:ring-gray-300 dark:focus:ring-gray-600"
          aria-expanded="false"
          data-dropdown-toggle="dropdown-user"
        >
          <span class="sr-only">Open user menu</span>
          <img
            class="w-8 h-8 rounded-full"
            src="https://flowbite.com/docs/images/people/profile-picture-5.jpg"
            alt="user photo"
          />
        </button>
        <div
          class="z-50 hidden my-4 text-base list-none bg-white divide-y divide-gray-100 rounded shadow dark:bg-gray-700 dark:divide-gray-600"
          id="dropdown-user"
        >
          <div *ngIf="userProfile" class="px-4 py-3" role="none">
            <p class="text-sm text-gray-900 dark:text-white" role="none">
              {{ userProfile.username }}
            </p>
            <p
              class="text-sm font-medium text-gray-900 truncate dark:text-gray-300"
              role="none"
            >
              {{ userProfile.email }}
            </p>
          </div>
          <button
            class="bloc w-full px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-600 dark:hover:text-white"
            type="button"
            (click)="logout()"
          >
            Log out
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
